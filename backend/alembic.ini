# Alembic configuration for KnowRAG.
#
# NOTE: this file must stay ASCII-only. configparser reads alembic.ini with the
# OS locale encoding (GBK on this machine), so non-ASCII comments raise
# UnicodeDecodeError before Alembic even starts. Keep explanations in
# alembic/env.py instead, which is read as UTF-8 by Python.

[alembic]
# Migration script directory. %(here)s keeps it resolvable from any cwd.
script_location = %(here)s/alembic

# Migration filename template: timestamp prefix + revision id.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Table that stores the applied revision ids.
version_table = alembic_version

prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
